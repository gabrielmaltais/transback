name: Feature request
description: Suggest an idea or a new setup to support
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need?
      description: The problem you want to solve, and how you do it today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
